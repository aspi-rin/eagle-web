services:
  eagle-web:
    build: .
    ports:
      - "13003:3000"
    volumes:
      - "${EAGLE_LIBRARY_1_PATH}:${EAGLE_LIBRARY_1_PATH}:ro"
      - "${EAGLE_LIBRARY_2_PATH}:${EAGLE_LIBRARY_2_PATH}:ro"
      - "${EAGLE_LIBRARY_3_PATH}:${EAGLE_LIBRARY_3_PATH}:ro"
    environment:
      LIBRARIES_JSON: '[{"name":"${EAGLE_LIBRARY_1_NAME:-Library 1}","path":"${EAGLE_LIBRARY_1_PATH}"},{"name":"${EAGLE_LIBRARY_2_NAME:-Library 2}","path":"${EAGLE_LIBRARY_2_PATH}"},{"name":"${EAGLE_LIBRARY_3_NAME:-Library 3}","path":"${EAGLE_LIBRARY_3_PATH}"}]'
    restart: unless-stopped
